# Proxy Configuration for RTSSP and RTSSP-SHP

# Protocol Mode (RTSSP or RTSSP-SHP)
mode=RTSSP-SHP

# Remote source (server sending to this proxy)
remote=localhost:5000

# Local delivery endpoints (where to forward frames)
localdelivery=localhost:7777

# === Part 2 (SHP) Settings ===
# Proxy keystore and credentials
proxy.keystore.path=proxy.jks
proxy.keystore.password=proxypass
proxy.keystore.alias=proxy
proxy.keystore.keypass=proxypass

# Proxy truststore (for verifying server certificate)
proxy.truststore.path=proxy.truststore
proxy.truststore.password=proxypass

# Server address for handshake (TCP)
server.host=localhost
server.port=8888

# Movie name being requested
movie.name=cars.dat
